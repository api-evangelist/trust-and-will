name: Trust & Will
description: >-
  Trust & Will is a digital estate planning platform, headquartered in San Diego,
  California and founded in 2017, that lets individuals and families create legally
  valid, state-specific estate planning documents entirely online. Members build
  will-based or trust-based estate plans and related documents such as guardianship
  designations, powers of attorney, and advance healthcare directives, and the
  company also offers probate support and nationwide notarization. Trust & Will
  distributes through direct-to-consumer subscriptions as well as B2B partnerships
  with financial advisors, wealth managers, and employers offering it as a benefit.
  The platform is SOC 2 and HIPAA compliant. It was surfaced in the API Evangelist
  network as a Techstars portfolio company; this enrichment pass found no public
  developer API, SDK, or developer portal, but did confirm a live security program
  and trust posture.
